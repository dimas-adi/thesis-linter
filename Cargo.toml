[package]
name = "docx-lint"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
eframe = { version = "0.37.0", default-features = false, features = ["glow", "default_fonts"] }
quick-xml = "0.42.0"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.1.8"
zip = { version = "9.2.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3.27.0"
